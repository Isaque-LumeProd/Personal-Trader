services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://trader:${POSTGRES_PASSWORD:-trader}@db:5432/trader
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-auto}
      HISTORY_RANGE: ${HISTORY_RANGE:-1y}
      APP_URL: ${APP_URL:-http://localhost:8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

volumes:
  pgdata:
